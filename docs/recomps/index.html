<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recomps &amp; Ports</title>
<meta name="description" content="Recompilations, decompilation ports and native ports of classic games, with links to repos and releases.">
<style>
  :root{--bg:#fafaf8;--fg:#1c1c1e;--muted:#6b6b70;--card:#fff;--line:#e4e4e0;--accent:#2f6fed;--tag:#eef2fb;--tagfg:#2f4a8a}
  @media (prefers-color-scheme:dark){:root{--bg:#121214;--fg:#ececee;--muted:#9a9aa2;--card:#1b1b1f;--line:#2c2c32;--accent:#7aa2ff;--tag:#23283a;--tagfg:#a9bdf0}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:19px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  main{max-width:960px;margin:0 auto;padding:48px 16px 64px}
  h1{font-size:2.6rem;margin:0 0 .25rem}
  .lede{color:var(--muted);margin:0 0 1.5rem}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1.5rem}
  .filters button{font:inherit;font-size:.95rem;padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
  .filters button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
  .grid{display:grid;gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 24px}
  .pic{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;margin-bottom:12px;background:var(--tag)}
  .pic.ph{display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:var(--tagfg);background:linear-gradient(135deg,var(--tag),var(--line))}
  .card h2{font-size:1.4rem;margin:0}
  .sub{color:var(--muted);font-size:.95rem;margin:2px 0 8px}
  .card p{margin:0 0 12px;font-size:1rem}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .tag{font-size:.85rem;background:var(--tag);color:var(--tagfg);padding:2px 8px;border-radius:6px}
  .links{display:flex;flex-wrap:wrap;gap:20px;font-size:1rem}
  .links a{color:var(--accent);text-decoration:none}
  .links a:hover{text-decoration:underline}
  .none{color:var(--muted)}
  footer{margin-top:2.5rem;color:var(--muted);font-size:.95rem}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Recomps &amp; Ports</h1>
  <p class="lede">Static recompilations, decompilation-based ports and native ports of classic games. None include game data: bring your own copy.</p>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <footer>Releases are mostly pre-releases and experimental. Not affiliated with the original publishers.</footer>
</main>
<script>
const R = (repo, tag) => ({repo, tag});
const games = [
  {name:"Portal 2", orig:"Valve, 2011", kind:"Recomp", platforms:["macOS","iPhone"],
   desc:"Portal 2's Linux x86 binaries statically recompiled to native ARM64. Playable on macOS and iPhone at 60 fps, with portals fired by tapping the back of the phone.",
   repo:"yoshisuga/portal2-recomp", img:"https://raw.githubusercontent.com/yoshisuga/portal2-recomp/main/docs/images/iphone-menu.jpg"},
  {name:"Half-Life 2", orig:"Valve, 2004", kind:"Recomp", platforms:["iPhone"],
   desc:"The Portal 2 recompiler pipeline applied to Half-Life 2's Linux binaries, running natively on iPhone. Built on your Mac from your own Steam copy; no prebuilt download.",
   repo:"yoshisuga/portal2-recomp", branch:"hl2/port", img:"img/hl2.jpg"},
  {name:"OutRunners", orig:"Sega, 1992 arcade", kind:"Decomp port", platforms:["iOS","New 3DS","PC","Switch"],
   desc:"Native port built on the verified C decompilation of the System Multi 32 arcade game, checked frame by frame against MAME.",
   repo:"yoshisuga/outrunners-port", img:"https://raw.githubusercontent.com/yoshisuga/outrunners-port/main/docs/screenshots/title_menu.png", tag:"v1.1.1-ios-3ds"},
  {name:"Wing Commander", orig:"Origin, 1990", kind:"Decomp port", platforms:["iOS","3DS","Desktop"],
   desc:"Source reconstruction of Wing Commander (Kilrathi Saga) with an SDL2 port.",
   repo:"yoshisuga/wc1-re", img:"https://raw.githubusercontent.com/yoshisuga/wc1-re/main/screenshots/title-screen.png"},
  {name:"Star Wars: TIE Fighter (OpenTIE)", orig:"LucasArts, 1994", kind:"Reimplementation", platforms:["iOS","3DS"],
   desc:"Open reimplementation of TIE Fighter running the original game data natively.",
   repo:"yoshisuga/OpenTIE", img:"https://raw.githubusercontent.com/yoshisuga/OpenTIE/main/assets/opentie-001.jpg", tag:"ios-v0.2.0"},
  {name:"Jedi Knight: Dark Forces II (OpenJKDF2)", orig:"LucasArts, 1997", kind:"Reimplementation", platforms:["iOS","iPadOS"],
   desc:"Function-by-function reimplementation in C, with an unofficial iPhone and iPad build and touch controls.",
   repo:"yoshisuga/First-repo-for-Claude-for-JKDF2", img:"https://raw.githubusercontent.com/yoshisuga/First-repo-for-Claude-for-JKDF2/claude/openjkdf2-ios-build-2gcr9s/docs/images/screenshot.png", tag:"ios-latest"},
  {name:"Doom II RPG", orig:"id Software / Fountainhead, 2005", kind:"Decomp port", platforms:["iOS"],
   desc:"Fork of the Doom II RPG reverse-engineering project, with in-progress iOS port work on the ios-port branch.",
   repo:"yoshisuga/DoomIIRPG-RE", img:"img/doom2rpg.jpg", tag:"ios-v0.1.0"},
  {name:"Jedi Outcast / Jedi Academy (OpenJK)", orig:"Raven Software, 2002 / 2003", kind:"Source port", platforms:["iOS"],
   desc:"iOS builds of Jedi Outcast (single player) and Jedi Academy on the OpenJK engine. Work lives on the OpenJK-iOS branch.",
   repo:"yoshisuga/OpenJK", branch:"OpenJK-iOS"},
  {name:"Star Fox Enhanced", orig:"Nintendo, 1993", kind:"Source port", platforms:["iOS","Windows"],
   desc:"Native port of the UltraStarFox codebase at selectable frame rates up to 480 FPS.",
   repo:"yoshisuga/starfox-enhanced", tag:"2026.08.28"},
  {name:"Flycast", orig:"Sega Dreamcast, 1998", kind:"Emulator port", platforms:["iOS 26"],
   desc:"Flycast for iOS 26 with StikDebug support.",
   repo:"yoshisuga/Flycast-iOS", tag:"v1.0-20260823"}
];

games.sort((a,b) => +a.orig.match(/\d{4}/)[0] - +b.orig.match(/\d{4}/)[0]);
const gh = "https://github.com/";
const kinds = ["All", ...new Set(games.map(g => g.kind))];
const filters = document.getElementById("filters"), grid = document.getElementById("grid");
let active = "All";

function esc(s){return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function render(){
  filters.innerHTML = kinds.map(k => `<button aria-pressed="${k===active}" data-k="${esc(k)}">${esc(k)}</button>`).join("");
  grid.innerHTML = games.filter(g => active==="All" || g.kind===active).map(g => `
    <article class="card">
      ${g.img?`<img class="pic" loading="lazy" src="${g.img}" alt="${esc(g.name)} screenshot">`:`<div class="pic ph" aria-hidden="true">${esc(g.name.trim()[0])}</div>`}
      <h2>${esc(g.name)}</h2>
      <div class="sub">${esc(g.orig)} · ${esc(g.kind)}</div>
      <p>${esc(g.desc)}</p>
      <div class="tags">${g.platforms.map(p => `<span class="tag">${esc(p)}</span>`).join("")}</div>
      <div class="links">
        <a href="${gh}${g.repo}${g.branch?"/tree/"+g.branch:""}">Repository${g.branch?" ("+esc(g.branch)+")":""}</a>
        ${g.tag
          ? `<a href="${gh}${g.repo}/releases/tag/${encodeURIComponent(g.tag)}">Latest: ${esc(g.tag)}</a><a href="${gh}${g.repo}/releases">All releases</a>`
          : `<span class="none">No releases yet</span>`}
      </div>
    </article>`).join("");
}
filters.addEventListener("click", e => { const b = e.target.closest("button"); if(b){active=b.dataset.k; render();} });
render();
</script>
</body>
</html>
